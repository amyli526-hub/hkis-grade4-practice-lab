<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HKIS Grade 4 Admissions Practice Lab</title>
<style>
:root{
  --navy:#0f2c52; --navy2:#163b6b; --red:#c8102e; --ink:#1c2430; --muted:#647083;
  --bg:#f2efe8; --card:#ffffff; --line:#e4ded2; --good:#137a4b; --goodbg:#e6f5ec;
  --bad:#b3261e; --badbg:#fbe9e7; --amber:#a86400; --amberbg:#fff3d6; --blue:#2563eb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible{outline:3px solid #9db4d8;outline-offset:2px}
.topbar{
  background:linear-gradient(90deg,var(--navy),var(--navy2)); color:#fff;
  padding:13px 22px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; position:sticky; top:0; z-index:30; box-shadow:0 2px 10px rgba(0,0,0,.16);
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.crest{
  width:38px;height:38px;border-radius:10px;background:#fff;color:var(--navy);
  display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;
  border:2px solid #d8c79a; flex:none;
}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:11px;color:#c9d6ea;font-weight:500;letter-spacing:.4px}
.topmeta{font-size:12px;color:#c9d6ea;text-align:right;line-height:1.35}
.topmeta b{color:#fff}
.tabs{
  display:flex; gap:4px; flex-wrap:wrap; background:#fff; padding:8px 16px;
  border-bottom:1px solid var(--line); position:sticky; top:64px; z-index:20;
}
.tab{
  border:0;background:transparent;color:#3d4a5c;padding:9px 14px;border-radius:9px;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;
}
.tab:hover{background:#f1eee6;color:var(--navy)}
.tab.active{background:var(--navy);color:#fff}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:7px;vertical-align:middle}
.wrap{max-width:1060px;margin:0 auto;padding:24px 16px 70px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 2px rgba(20,20,20,.04)}
.card h2{font-size:16px;margin:0 0 4px;color:var(--navy)}
.card h3{font-size:14px;margin:0 0 10px;color:var(--navy)}
.card p{margin:6px 0;font-size:14.5px;color:#3f4a5a;line-height:1.6}
.hero{
  background:
    radial-gradient(1200px 300px at 85% -20%,rgba(200,16,46,.22),transparent 60%),
    linear-gradient(100deg,var(--navy),#204a86 70%,#2a5aa0);
  color:#fff;border-radius:18px;padding:26px 26px 22px;position:relative;overflow:hidden;
}
.hero h2{color:#fff;font-size:22px;margin:0 0 8px}
.hero p{color:#dbe6f7;max-width:620px}
.hero .count{display:flex;align-items:flex-end;gap:10px;margin:14px 0 6px}
.hero .count b{font-size:52px;line-height:.9;font-weight:800;letter-spacing:-1px}
.hero .count span{font-size:13px;color:#c9d6ea;padding-bottom:6px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.2px;background:#eef2f8;color:#33445c;
}
.pill.red{background:#fdecef;color:#a50e27}
.pill.green{background:var(--goodbg);color:var(--good)}
.pill.amber{background:var(--amberbg);color:var(--amber)}
.btn{
  border:0;border-radius:11px;padding:11px 17px;font-size:14px;font-weight:700;cursor:pointer;
  background:var(--navy);color:#fff;transition:.15s;display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.red{background:var(--red)}
.btn.green{background:#137a4b}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid #cfd8e6}
.btn.ghost:hover{background:#f5f8fd}
.btn.soft{background:#eef2f8;color:var(--navy)}
.btn.small{padding:8px 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.rated{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .n{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1}
.stat .l{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-top:4px}
.bar{height:9px;border-radius:99px;background:#ece8df;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--navy);transition:width .4s}
.skillrow{display:grid;grid-template-columns:190px 1fr 44px;gap:12px;align-items:center;padding:7px 0}
.skillrow .name{font-size:14px;font-weight:600;color:#33445c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skillrow .pct{font-size:14px;font-weight:800;color:var(--navy);text-align:right}
.empty{font-size:14px;color:var(--muted);padding:8px 0}
.planitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eee7db;font-size:14.5px}
.planitem:last-child{border-bottom:0}
.planitem .tick{width:23px;height:23px;border-radius:7px;border:2px solid #c8d2e1;display:grid;place-items:center;font-size:14px;color:#fff;flex:none;cursor:pointer;background:#fff;padding:0;font-family:inherit;line-height:1;appearance:none}
.planitem.done .tick{background:var(--good);border-color:var(--good)}
.planitem.done .lbl{text-decoration:line-through;color:#93a0b2}
.planitem .lbl{flex:1}
.planitem .go{font-size:12px;color:var(--blue);font-weight:700;cursor:pointer;background:none;border:0}
.timer{
  font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.5px;font-size:17px;
  background:#0b2342;color:#fff;padding:7px 13px;border-radius:9px;
}
.timer.warn{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.exambar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.progressline{height:7px;background:#e8e3d9;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progressline i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--blue));transition:width .3s}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(20,20,20,.05)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qtag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);background:#eef3fe;padding:4px 9px;border-radius:6px}
.qnum{font-size:14px;color:var(--muted);font-weight:600}
.passage{
  background:#f8f6f0;border-left:4px solid #c8b98f;padding:14px 16px;border-radius:0 10px 10px 0;
  font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.7;color:#333c49;
  white-space:pre-line;margin-bottom:16px;
}
.poem{font-family:Georgia,serif;white-space:pre-line;line-height:1.75;font-style:italic}
.qtext{font-size:20px;line-height:1.55;font-weight:600;margin:6px 0 20px;color:#17202c}
.choices{display:grid;gap:10px}
.choice{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:#fff;border:2px solid #dfe5ee;border-radius:12px;padding:13px 15px;cursor:pointer;
  font-size:15.5px;color:#22303f;line-height:1.45;transition:.12s;
}
.choice:hover{border-color:#9db4d8;background:#f7faff}
.choice .badge{
  width:26px;height:26px;border-radius:50%;background:#eef2f8;color:var(--navy);
  display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none;margin-top:1px;
}
.choice.sel{border-color:var(--navy);background:#eef3fb;box-shadow:0 0 0 3px rgba(15,44,82,.08)}
.choice.sel .badge{background:var(--navy);color:#fff}
.choice.correct{border-color:var(--good);background:var(--goodbg)}
.choice.correct .badge{background:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.choice.wrong .badge{background:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.feedback{border-radius:12px;padding:14px 16px;margin-top:18px;font-size:14px;line-height:1.55}
.feedback.good{background:var(--goodbg);border:1px solid #bfe3cd}
.feedback.bad{background:var(--badbg);border:1px solid #f0c6c1}
.feedback b{display:block;font-size:15px;margin-bottom:5px}
.feedback.good b{color:var(--good)} .feedback.bad b{color:var(--bad)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.kicker{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
textarea{
  width:100%;border:1.5px solid #d7deea;border-radius:12px;padding:14px;font-size:15px;
  line-height:1.6;font-family:inherit;resize:vertical;min-height:280px;background:#fff;color:var(--ink);
}
textarea:focus{outline:2px solid #9db4d8;border-color:#9db4d8}
select,input[type=date],input[type=text]{
  border:1.5px solid #d7deea;border-radius:9px;padding:9px 11px;font-size:13.5px;background:#fff;font-family:inherit;color:var(--ink);
}
input[type=text]{min-width:180px}
label.check{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;padding:6px 0;color:#33445c;cursor:pointer}
label.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--navy)}
.split{display:grid;grid-template-columns:1.45fr .8fr;gap:16px;align-items:start}
.note{background:#fff9e9;border:1px solid #f0ddac;border-radius:12px;padding:12px 14px;font-size:14px;color:#6b551c;line-height:1.6}
.disclaimer{font-size:14px;color:#8b8576;line-height:1.6;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid #f0ece3;color:#33445c;font-size:14px}
.ritbadge{display:inline-block;min-width:46px;text-align:center;font-weight:800;color:#fff;background:var(--navy);border-radius:7px;padding:3px 8px;font-size:12.5px}
.center{text-align:center}
.bigscore{font-size:56px;font-weight:800;line-height:1;color:var(--navy);letter-spacing:-1.5px}
.orch{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.donut{
  --p:0;width:132px;height:132px;border-radius:50%;flex:none;
  background:conic-gradient(var(--navy) calc(var(--p)*1%),#e8e3d9 0);
  display:grid;place-items:center;position:relative;
}
.donut::before{content:"";position:absolute;width:98px;height:98px;border-radius:50%;background:#fff}
.donut span{position:relative;font-size:24px;font-weight:800;color:var(--navy)}
.review{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;font-size:14px;line-height:1.55;background:#fff}
.review .rq{font-weight:600;color:#22303f}
.review .ra{color:var(--good);font-weight:700}
.review .rs{color:var(--bad);font-weight:700}
.review .re{color:#5b6778;margin-top:5px}
.tabpane{display:none}
.tabpane.active{display:block}
.optionrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.footer{text-align:center;font-size:14px;color:#989181;padding:26px 10px 0}
.footer a{color:#7a7364}
.scoring{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:820px){
  .g2,.g3,.g4,.split,.scoring{grid-template-columns:1fr}
  .skillrow{grid-template-columns:130px 1fr 40px}
  .qtext{font-size:18px}
  .hero .count b{font-size:42px}
  .wrap{padding:16px 12px 60px}
  .tabs{top:60px}
}
@media print{
  .topbar,.tabs,.footer,.actions,button{display:none!important}
  .planitem .tick{display:grid!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;page-break-inside:avoid}
  .hero{background:#0f2c52!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="crest">HKIS</div>
    <div>
      <h1>Grade 4 Admissions Practice Lab</h1>
      <span>Computerized adaptive practice for the pre-entry assessment</span>
    </div>
  </div>
  <div class="topmeta" id="topmeta">Test day: <b>28 Nov 2026</b></div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Practice sections"></nav>
<main class="wrap" id="app"></main>
<div class="footer">Unofficial practice tool. Not affiliated with Hong Kong International School or NWEA. Scores here are practice estimates, not admissions predictions.</div>

<script>
const STORE_KEY = "hkis_g4_lab_v1";
const TEST_DATE_DEFAULT = "2026-11-28";

function defaultState(){
  return {
    name:"",
    testDate:TEST_DATE_DEFAULT,
    skills:{},
    ability:{reading:200,language:200,math:200},
    history:[],
    drafts:{},
    oralNotes:[],
    streak:{last:null,count:0},
    plan:{date:null,items:[],done:{}},
    writingDone:0,
    writingLog:{}
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const s = Object.assign(defaultState(), JSON.parse(raw));
    s.skills = s.skills || {};
    s.ability = Object.assign({reading:200,language:200,math:200}, s.ability||{});
    s.drafts = s.drafts || {};
    s.history = s.history || [];
    s.writingLog = s.writingLog || {};
    s.oralNotes = s.oralNotes || [];
    return s;
  }catch(e){ return defaultState(); }
}
let state = loadState();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

const SECTIONS = {
  reading:{name:"Reading", short:"Reading", color:"#2563eb"},
  language:{name:"Language Usage", short:"Language", color:"#7c3aed"},
  math:{name:"Mathematics", short:"Math", color:"#059669"}
};

const DB = [
{id:`r1`,s:`reading`,k:`Vocabulary`,r:188,q:`What does the prefix un- mean in the word unhappy?`,ch:[`before`,`not`,`again`,`wrongly`],a:1,exp:`The prefix un- means "not." Unhappy means not happy.`},
{id:`r2`,s:`reading`,k:`Vocabulary`,r:190,q:`In the word rewrite, what does the prefix re- mean?`,ch:[`before`,`again`,`not`,`under`],a:1,exp:`Re- means "again." To rewrite is to write again.`},
{id:`r3`,s:`reading`,k:`Vocabulary`,r:197,q:`Read the sentence. The arid desert had no water for miles. What does arid mean?`,ch:[`very cold`,`very dry`,`very noisy`,`very crowded`],a:1,exp:`Arid means very dry. The clue "had no water" helps you.`},
{id:`r4`,s:`reading`,k:`Vocabulary`,r:196,q:`Read the sentence. The timid puppy hid behind the sofa when visitors arrived. What does timid mean?`,ch:[`shy`,`angry`,`hungry`,`fast`],a:0,exp:`Timid means shy or easily frightened. Hiding is a clue.`},
{id:`r5`,s:`reading`,k:`Vocabulary`,r:195,q:`What does the suffix -less mean in the word careless?`,ch:[`full of`,`without`,`again`,`before`],a:1,exp:`The suffix -less means "without." Careless means without care.`},
{id:`r6`,s:`reading`,k:`Vocabulary`,r:205,q:`The Greek root tele means far. What does the word telescope most likely mean?`,ch:[`a tool for seeing far away`,`a tool for hearing`,`a tool for measuring heat`,`a tool for writing`],a:0,exp:`Tele means far and scope relates to seeing, so a telescope sees far away.`},
{id:`r7`,s:`reading`,k:`Vocabulary`,r:198,q:`Read the sentence. The sturdy bridge did not move, even in strong wind. What does sturdy mean?`,ch:[`weak`,`strong`,`narrow`,`old`],a:1,exp:`Sturdy means strong and well built. The clue is that it did not move.`},
{id:`r8`,s:`reading`,k:`Vocabulary`,r:208,q:`Read the sentence. She was reluctant to speak, so she stayed silent during the meeting. What does reluctant mean?`,ch:[`eager`,`unwilling`,`unable`,`happy`],a:1,exp:`Reluctant means unwilling or hesitant. Staying silent shows she did not want to speak.`},
{id:`r9`,s:`reading`,k:`Vocabulary`,r:194,q:`Read the sentence. The crowd was enormous, filling the whole stadium. What does enormous mean?`,ch:[`very small`,`very large`,`very quiet`,`very late`],a:1,exp:`Enormous means very large. Filling a whole stadium is the clue.`},
{id:`r10`,s:`reading`,k:`Vocabulary`,r:205,q:`The root bio means life. What does biology most likely study?`,ch:[`rocks`,`living things`,`numbers`,`stars`],a:1,exp:`Bio means life, so biology is the study of living things.`},
{id:`r11`,s:`reading`,k:`Vocabulary`,r:197,q:`Read the sentence. Handle the fragile vase carefully, or it will break. What does fragile mean?`,ch:[`easily broken`,`very heavy`,`quite ugly`,`hard to find`],a:0,exp:`Fragile means easily broken. The clue is "or it will break."`},
{id:`r12`,s:`reading`,k:`Vocabulary`,r:206,q:`Read the sentence. The hikers trudged slowly through the deep snow. What does trudged mean?`,ch:[`ran quickly`,`walked heavily`,`jumped high`,`sat still`],a:1,exp:`Trudged means walked slowly and heavily, as if tired.`},
{id:`r13`,s:`reading`,k:`Vocabulary`,r:199,q:`What does the prefix mis- mean in the word misunderstand?`,ch:[`wrongly`,`before`,`again`,`too much`],a:0,exp:`Mis- means wrongly. To misunderstand is to understand wrongly.`},
{id:`r14`,s:`reading`,k:`Vocabulary`,r:216,q:`Read the sentence. The scientist's idea was plausible, so other researchers wanted to test it. What does plausible mean?`,ch:[`believable`,`impossible`,`dangerous`,`expensive`],a:0,exp:`Plausible means believable or reasonable.`},
{id:`r15`,s:`reading`,k:`Vocabulary`,r:218,q:`Read the sentence. The ancient ruins were dilapidated, with broken walls and crumbling roofs. What does dilapidated mean?`,ch:[`newly built`,`falling apart`,`freshly painted`,`well guarded`],a:1,exp:`Dilapidated means in poor condition, falling apart.`},
{id:`r16`,s:`reading`,k:`Vocabulary`,r:217,q:`Read the sentence. Her speech was concise, using only a few words to make her point. What does concise mean?`,ch:[`brief and clear`,`long and boring`,`loud and angry`,`confusing`],a:0,exp:`Concise means short and clear, using few words.`},
{id:`r17`,s:`reading`,k:`Vocabulary`,r:206,q:`The Latin root aqua means water. Which word most likely relates to water?`,ch:[`aquatic`,`audible`,`annual`,`artistic`],a:0,exp:`Aquatic comes from aqua, meaning water.`},
{id:`r18`,s:`reading`,k:`Vocabulary`,r:219,q:`Read the sentence. The medicine had an adverse effect and made him feel worse. What does adverse mean?`,ch:[`helpful`,`harmful`,`sleepy`,`strange`],a:1,exp:`Adverse means unfavorable or harmful.`},
{id:`r19`,s:`reading`,k:`Vocabulary`,r:226,q:`Read the sentence. He was meticulous, checking every detail twice before handing in his work. What does meticulous mean?`,ch:[`careless`,`very careful`,`very fast`,`uninterested`],a:1,exp:`Meticulous means extremely careful about details.`},
{id:`r20`,s:`reading`,k:`Vocabulary`,r:228,q:`Read the sentence. The evidence was ambiguous, so people could interpret it in two different ways. What does ambiguous mean?`,ch:[`unclear`,`obvious`,`false`,`heavy`],a:0,exp:`Ambiguous means unclear because it can be understood in more than one way.`},

{id:`r21`,s:`reading`,k:`Literary Text`,r:200,p:`TREES

I think that I shall never see
A poem lovely as a tree.
A tree that may in summer wear
A nest of robins in her hair;
Upon whose bosom snow has lain;
Who intimately lives with rain.`,q:`What is the theme of this poem?`,ch:[`Appreciating the beauty of nature`,`Enjoying the benefits of summer`,`Criticizing bad weather`,`Studying the habits of birds`],a:0,exp:`The poem praises the tree in many seasons, so the theme is appreciating nature's beauty.`},
{id:`r22`,s:`reading`,k:`Literary Text`,r:197,q:`Read the sentence. The wind whispered through the leaves. This sentence uses which kind of figurative language?`,ch:[`simile`,`personification`,`hyperbole`,`alliteration`],a:1,exp:`Personification gives human qualities to something nonhuman. Wind cannot whisper.`},
{id:`r23`,s:`reading`,k:`Literary Text`,r:190,q:`Read the sentence. Her smile was as bright as the sun. This sentence is an example of a ...`,ch:[`metaphor`,`simile`,`idiom`,`rhyme`],a:1,exp:`A simile compares two things using "as" or "like."`},
{id:`r24`,s:`reading`,k:`Literary Text`,r:196,q:`Read the sentence. The classroom was a zoo. This sentence is an example of a ...`,ch:[`simile`,`metaphor`,`personification`,`idiom`],a:1,exp:`A metaphor says one thing is another to make a comparison. It does not use like or as.`},
{id:`r25`,s:`reading`,k:`Literary Text`,r:198,q:`Read the sentence. I have to hit the books before the test tomorrow. What does hit the books mean?`,ch:[`throw books away`,`study hard`,`borrow books`,`read for fun`],a:1,exp:`Hit the books is an idiom that means to study.`},
{id:`r26`,s:`reading`,k:`Literary Text`,r:195,p:`Maya noticed that the new girl, Lily, was eating lunch alone. Maya usually sat with her friends, who were laughing loudly. For a moment, Maya hesitated. Then she picked up her tray, walked across the cafeteria, and asked, "May I sit with you?" Lily smiled and nodded.`,q:`Which word best describes Maya?`,ch:[`kind`,`bossy`,`careless`,`shy`],a:0,exp:`Maya gave up sitting with her friends to help a lonely student, which shows she is kind.`},
{id:`r27`,s:`reading`,k:`Literary Text`,r:203,p:`Maya noticed that the new girl, Lily, was eating lunch alone. Maya usually sat with her friends, who were laughing loudly. For a moment, Maya hesitated. Then she picked up her tray, walked across the cafeteria, and asked, "May I sit with you?" Lily smiled and nodded.`,q:`Why did Maya hesitate at first?`,ch:[`She did not like Lily.`,`She was unsure about leaving her friends.`,`She could not find a seat.`,`She forgot her lunch.`],a:1,exp:`Maya usually sits with her friends, so she paused to decide whether to leave them.`},
{id:`r28`,s:`reading`,k:`Literary Text`,r:200,p:`A rabbit laughed at a turtle for walking so slowly. "I can beat you in a race," the turtle said. The rabbit ran ahead but stopped to take a nap. The turtle kept walking and crossed the finish line first.`,q:`What is the lesson of the story?`,ch:[`Turtles are faster than rabbits.`,`Steady effort can beat overconfidence.`,`Never take a nap outdoors.`,`Racing is not a good idea.`],a:1,exp:`The turtle kept working while the rabbit was overconfident, so steady effort won.`},
{id:`r29`,s:`reading`,k:`Literary Text`,r:210,p:`The old house stood at the end of the lane. Its windows were dark, and the wind made the wooden door creak. Sam pulled his coat tighter and hurried past.`,q:`What is the mood of this passage?`,ch:[`cheerful and funny`,`quiet and peaceful`,`uneasy and suspenseful`,`angry and loud`],a:2,exp:`Dark windows, creaking doors, and hurrying past create an uneasy, suspenseful mood.`},
{id:`r30`,s:`reading`,k:`Literary Text`,r:212,p:`Rain on the roof, rain on the street, rain on the windows, rain on my feet.`,q:`Why does the poet repeat "rain on"?`,ch:[`To show the rain is everywhere`,`To make the poem shorter`,`To describe the sun`,`To tell the time`],a:0,exp:`The repetition emphasizes that rain is falling everywhere and creates a rhythm.`},
{id:`r31`,s:`reading`,k:`Literary Text`,r:208,p:`Leo practiced the piano every day after school. He wanted to play in the school concert more than anything else.`,q:`Why did Leo practice every day?`,ch:[`He wanted to perform in the concert.`,`He wanted to avoid homework.`,`His teacher gave him candy.`,`He was bored.`],a:0,exp:`The passage says he wanted to play in the school concert, which motivates his practice.`},
{id:`r32`,s:`reading`,k:`Literary Text`,r:215,p:`Ben shared his snack with the student who had none. Ana kept both of her snacks for herself.`,q:`Which pair of words best describes Ben and Ana?`,ch:[`generous and selfish`,`funny and serious`,`brave and afraid`,`quiet and loud`],a:0,exp:`Ben is generous because he shared. Ana is selfish because she kept everything.`},
{id:`r33`,s:`reading`,k:`Literary Text`,r:213,p:`The story takes place on a small ship during a terrible storm.`,q:`Why is the setting important to the story?`,ch:[`It explains what the characters eat.`,`It creates danger and tension.`,`It shows that the ship is new.`,`It tells the time of day.`],a:1,exp:`A ship in a storm creates danger and tension, which shapes the events.`},
{id:`r34`,s:`reading`,k:`Literary Text`,r:201,q:`Read the fable. A lion let a mouse go free. Later, the mouse chewed the ropes that trapped the lion. What is the message?`,ch:[`Even small friends can help in big ways.`,`Lions are stronger than mice.`,`Never help anyone.`,`Ropes are easy to break.`],a:0,exp:`The small mouse helps the powerful lion, so the message is that even small friends can help.`},
{id:`r35`,s:`reading`,k:`Literary Text`,r:199,q:`Read the sentence. The weekend flew by, and Monday arrived too soon. What does flew by mean?`,ch:[`passed quickly`,`went by plane`,`was cancelled`,`felt boring`],a:0,exp:`Time flew by means time passed quickly.`},

{id:`r36`,s:`reading`,k:`Informational Text`,r:203,p:`Antarctica, where the South Pole is located, is the coldest place on Earth. Almost all of it is covered by thick ice, and it is also the driest continent. It is called a desert because it gets very little rain or snow each year. Antarctica is huge: it is bigger than Europe and almost twice the size of Australia. Yet no one lives there permanently. Scientists stay at research stations for part of the year. Penguins, seals, and whales live there, and long ago the climate was much warmer.`,q:`What is the main idea of the passage?`,ch:[`Antarctica is an extreme, mostly uninhabited continent.`,`Penguins are the most important animals.`,`Scientists should not visit Antarctica.`,`Antarctica is the same size as Australia.`],a:0,exp:`Most of the passage describes Antarctica's extreme conditions and lack of permanent residents.`},
{id:`r37`,s:`reading`,k:`Informational Text`,r:208,p:`Antarctica, where the South Pole is located, is the coldest place on Earth. Almost all of it is covered by thick ice, and it is also the driest continent. It is called a desert because it gets very little rain or snow each year. Antarctica is huge: it is bigger than Europe and almost twice the size of Australia. Yet no one lives there permanently. Scientists stay at research stations for part of the year. Penguins, seals, and whales live there, and long ago the climate was much warmer.`,q:`Why does the author mention Europe and Australia?`,ch:[`To show how big Antarctica is`,`To show how cold Antarctica is`,`To compare the animals there`,`To explain who lives there`],a:0,exp:`Europe and Australia are used as familiar comparisons to show Antarctica's size.`},
{id:`r38`,s:`reading`,k:`Informational Text`,r:193,q:`A recipe gives steps for making pancakes. What is the author's purpose?`,ch:[`to entertain`,`to inform`,`to persuade`,`to instruct`],a:3,exp:`A recipe tells the reader how to do something, so the purpose is to instruct.`},
{id:`r39`,s:`reading`,k:`Informational Text`,r:207,p:`Black bears and polar bears are both bears, but they live in very different places. Black bears live in forests and eat berries, fish, and plants. Polar bears live in the frozen Arctic and hunt seals.`,q:`How is this passage organized?`,ch:[`problem and solution`,`compare and contrast`,`cause and effect`,`sequence of events`],a:1,exp:`The passage tells how the two bears are alike and different, which is compare and contrast.`},
{id:`r40`,s:`reading`,k:`Informational Text`,r:204,p:`Exercise helps your body in many ways. It makes your heart stronger and your muscles grow. It also helps you sleep better at night.`,q:`Which detail best supports the main idea?`,ch:[`Exercise makes your heart stronger.`,`Many people own bicycles.`,`Sleep is important for everyone.`,`Muscles are made of cells.`],a:0,exp:`The main idea is that exercise helps the body, and a stronger heart is a supporting detail.`},
{id:`r41`,s:`reading`,k:`Informational Text`,r:197,p:`Because the town received very little rain that year, the lake shrank to half its size.`,q:`What is the effect of the town receiving little rain?`,ch:[`The lake shrank.`,`The town grew larger.`,`The rain stopped forever.`,`The lake became deeper.`],a:0,exp:`The passage states the effect directly: the lake shrank to half its size.`},
{id:`r42`,s:`reading`,k:`Informational Text`,r:195,q:`Which sentence is an opinion?`,ch:[`Pizza is the best food in the world.`,`Pizza is made with dough and cheese.`,`Many people eat pizza.`,`Pizza can be cooked in an oven.`],a:0,exp:`"Best" is a judgment, so it is an opinion and cannot be proven.`},
{id:`r43`,s:`reading`,k:`Informational Text`,r:206,p:`Owls are nocturnal. They hunt for food at night and sleep during the day.`,q:`What does nocturnal mean?`,ch:[`active at night`,`afraid of the dark`,`able to fly`,`very small`],a:0,exp:`The next sentence explains it: they hunt at night and sleep during the day.`},
{id:`r44`,s:`reading`,k:`Informational Text`,r:214,p:`Antarctica, where the South Pole is located, is the coldest place on Earth. Almost all of it is covered by thick ice, and it is also the driest continent. It is called a desert because it gets very little rain or snow each year. Antarctica is huge: it is bigger than Europe and almost twice the size of Australia. Yet no one lives there permanently. Scientists stay at research stations for part of the year. Penguins, seals, and whales live there, and long ago the climate was much warmer.`,q:`Which sentence best summarizes the passage?`,ch:[`Antarctica is a huge, cold, dry continent with no permanent residents.`,`Antarctica is a warm continent full of forests.`,`Many families live in Antarctica all year.`,`Antarctica is smaller than Europe.`],a:0,exp:`A good summary includes the main points: size, cold, dry, and no permanent residents.`},
{id:`r45`,s:`reading`,k:`Informational Text`,r:215,p:`Antarctica, where the South Pole is located, is the coldest place on Earth. Almost all of it is covered by thick ice, and it is also the driest continent. It is called a desert because it gets very little rain or snow each year. Antarctica is huge: it is bigger than Europe and almost twice the size of Australia. Yet no one lives there permanently. Scientists stay at research stations for part of the year. Penguins, seals, and whales live there, and long ago the climate was much warmer.`,q:`Why do people NOT live permanently in Antarctica?`,ch:[`The conditions are extremely harsh.`,`There is too much rain.`,`There are too many trees.`,`The continent is too small.`],a:0,exp:`The extreme cold, ice, and dryness make it too harsh for permanent homes.`},
{id:`r46`,s:`reading`,k:`Informational Text`,r:200,p:`Honeybees live in large groups called colonies. Each colony has one queen, many worker bees, and some drones. Worker bees do many jobs: they clean the hive, care for young bees, guard the entrance, and collect nectar from flowers. When a worker finds a good patch of flowers, it returns to the hive and performs a special dance. The dance tells the other bees which direction to fly and how far to go. In this way, the colony works together to find food.`,q:`What is the main idea of the passage?`,ch:[`Honeybees communicate and work together.`,`Only the queen bee works.`,`Bees dance for fun.`,`Hives are always empty.`],a:0,exp:`The passage explains how worker bees use a dance to share information and work together.`},
{id:`r47`,s:`reading`,k:`Informational Text`,r:211,p:`Honeybees live in large groups called colonies. Each colony has one queen, many worker bees, and some drones. Worker bees do many jobs: they clean the hive, care for young bees, guard the entrance, and collect nectar from flowers. When a worker finds a good patch of flowers, it returns to the hive and performs a special dance. The dance tells the other bees which direction to fly and how far to go. In this way, the colony works together to find food.`,q:`Which sentence best shows the author's point of view?`,ch:[`Honeybees are organized and cooperative.`,`Honeybees are dangerous and useless.`,`Honeybees are lazy.`,`Honeybees cannot communicate.`],a:0,exp:`The author emphasizes teamwork and communication, showing a positive view of bees.`},
{id:`r48`,s:`reading`,k:`Informational Text`,r:212,q:`You need facts about how volcanoes erupt. Which source is best?`,ch:[`a science website article`,`a comic book`,`a cookbook`,`a dictionary of names`],a:0,exp:`A science website article is the most reliable source for scientific facts.`},
{id:`r49`,s:`reading`,k:`Informational Text`,r:198,p:`First, the caterpillar hatches from an egg. Then it eats leaves and grows. Next, it forms a chrysalis. Finally, a butterfly comes out.`,q:`What happens right after the caterpillar forms a chrysalis?`,ch:[`A butterfly comes out.`,`It eats leaves.`,`It hatches from an egg.`,`It flies south.`],a:0,exp:`The sequence says finally, a butterfly comes out after the chrysalis stage.`},
{id:`r50`,s:`reading`,k:`Informational Text`,r:209,p:`Maya noticed that the new girl, Lily, was eating lunch alone. Maya usually sat with her friends, who were laughing loudly. For a moment, Maya hesitated. Then she picked up her tray, walked across the cafeteria, and asked, "May I sit with you?" Lily smiled and nodded.`,q:`Which conclusion is best supported by the passage?`,ch:[`Lily felt welcomed by Maya.`,`Lily wanted to eat alone.`,`Maya's friends were angry.`,`Maya left the cafeteria.`],a:0,exp:`Lily smiled and nodded, which supports the conclusion that she felt welcomed.`},

{id:`l1`,s:`language`,k:`Mechanics`,r:196,q:`What is the correct spelling for more than one wolf?`,ch:[`wolfs`,`wolvs`,`wolves`,`wolfes`],a:2,exp:`Nouns ending in f often change f to v and add es: wolf becomes wolves.`},
{id:`l2`,s:`language`,k:`Mechanics`,r:188,q:`Which word should be capitalized in this sentence? My friend lives in paris.`,ch:[`my`,`friend`,`paris`,`lives`],a:2,exp:`Paris is a proper noun, the name of a place, so it needs a capital letter.`},
{id:`l3`,s:`language`,k:`Mechanics`,r:195,q:`Which sentence uses commas correctly in a list?`,ch:[`I packed apples bread and cheese.`,`I packed apples, bread, and cheese.`,`I packed, apples bread and cheese.`,`I packed apples, bread and, cheese.`],a:1,exp:`Use a comma between each item in a list and before "and."`},
{id:`l4`,s:`language`,k:`Mechanics`,r:193,q:`Which word is spelled correctly?`,ch:[`beutiful`,`beautiful`,`beautifull`,`beautifal`],a:1,exp:`The correct spelling is beautiful.`},
{id:`l5`,s:`language`,k:`Mechanics`,r:197,q:`Which sentence uses the apostrophe correctly?`,ch:[`The dog's bone is buried.`,`The dogs bone is buried.`,`The dog's are barking.`,`The dogs' is barking.`],a:0,exp:`The dog's bone shows that the bone belongs to one dog.`},
{id:`l6`,s:`language`,k:`Mechanics`,r:207,q:`Which sentence uses quotation marks correctly?`,ch:[`Mia said, I will be there soon.`,`Mia said, "I will be there soon."`,`Mia said "I will be there soon".`,`"Mia said, I will be there soon."`],a:1,exp:`Put quotation marks around the speaker's exact words.`},
{id:`l7`,s:`language`,k:`Mechanics`,r:189,q:`What is the correct plural of child?`,ch:[`childs`,`childes`,`children`,`childrens`],a:2,exp:`Child has an irregular plural: children.`},
{id:`l8`,s:`language`,k:`Mechanics`,r:208,q:`Choose the correct word. The cat licked ___ paw.`,ch:[`its`,`it's`,`its'`,`it is`],a:0,exp:`Its shows possession. It's is a contraction meaning it is.`},
{id:`l9`,s:`language`,k:`Mechanics`,r:210,q:`Which sentence uses the comma correctly?`,ch:[`After the storm we, went outside.`,`After the storm, we went outside.`,`After, the storm we went outside.`,`After the storm we went, outside.`],a:1,exp:`Put a comma after an introductory phrase such as "After the storm."`},
{id:`l10`,s:`language`,k:`Mechanics`,r:211,q:`Which word is spelled correctly?`,ch:[`recieved`,`received`,`receved`,`receeved`],a:1,exp:`The correct spelling is received. Remember: i before e except after c.`},
{id:`l11`,s:`language`,k:`Mechanics`,r:191,q:`What is the correct plural of leaf?`,ch:[`leafs`,`leaves`,`leafes`,`leafies`],a:1,exp:`Leaf becomes leaves, changing f to v and adding es.`},
{id:`l12`,s:`language`,k:`Mechanics`,r:186,q:`Which punctuation mark belongs at the end of this sentence? Where is my backpack`,ch:[`a period`,`a question mark`,`an exclamation mark`,`a comma`],a:1,exp:`The sentence asks a question, so it needs a question mark.`},
{id:`l13`,s:`language`,k:`Mechanics`,r:212,q:`Which word is spelled correctly?`,ch:[`seperate`,`separate`,`seperete`,`separete`],a:1,exp:`The correct spelling is separate. Remember there is "a rat" in the middle.`},
{id:`l14`,s:`language`,k:`Mechanics`,r:216,q:`Which sentence correctly shows that the projects belong to more than one student?`,ch:[`The students projects were displayed.`,`The student's projects were displayed.`,`The students' projects were displayed.`,`The students's projects were displayed.`],a:2,exp:`For a plural noun ending in s, add an apostrophe after the s: students'.`},
{id:`l15`,s:`language`,k:`Mechanics`,r:190,q:`Which words should be capitalized? We meet on monday in march.`,ch:[`we, meet`,`monday, march`,`on, in`,`meet, on`],a:1,exp:`Days of the week and months are proper nouns, so Monday and March need capitals.`},

{id:`l16`,s:`language`,k:`Parts of Speech`,r:197,q:`What is a proper noun?`,ch:[`a word that names a particular person, place, or thing`,`a word that describes a noun`,`a word that shows action`,`a word that replaces a noun`],a:0,exp:`A proper noun names a specific person, place, or thing and is capitalized.`},
{id:`l17`,s:`language`,k:`Parts of Speech`,r:189,q:`Find the adjective. The happy boy ran outside.`,ch:[`happy`,`boy`,`ran`,`outside`],a:0,exp:`Happy describes the boy, so it is an adjective.`},
{id:`l18`,s:`language`,k:`Parts of Speech`,r:187,q:`Find the verb. Birds sing loudly in the morning.`,ch:[`Birds`,`sing`,`loudly`,`morning`],a:1,exp:`Sing is the action word, so it is the verb.`},
{id:`l19`,s:`language`,k:`Parts of Speech`,r:198,q:`Find the adverb. She ran quickly to the door.`,ch:[`She`,`ran`,`quickly`,`door`],a:2,exp:`Quickly describes how she ran, so it is an adverb.`},
{id:`l20`,s:`language`,k:`Parts of Speech`,r:196,q:`Which word is a pronoun in this sentence? He found the keys under the chair.`,ch:[`He`,`found`,`keys`,`chair`],a:0,exp:`He replaces a person's name, so it is a pronoun.`},
{id:`l21`,s:`language`,k:`Parts of Speech`,r:199,q:`Which word is a conjunction? I wanted to go, but it rained.`,ch:[`wanted`,`go`,`but`,`rained`],a:2,exp:`But connects two ideas, so it is a conjunction.`},
{id:`l22`,s:`language`,k:`Parts of Speech`,r:205,q:`Which word is a preposition? The cat sat under the table.`,ch:[`cat`,`sat`,`under`,`table`],a:2,exp:`Under shows the position of the cat, so it is a preposition.`},
{id:`l23`,s:`language`,k:`Parts of Speech`,r:200,q:`What is the subject of this sentence? Ethan almost left his white socks on his bed.`,ch:[`white socks`,`his`,`left`,`Ethan`],a:3,exp:`Ethan is the one who left the socks, so Ethan is the subject.`},
{id:`l24`,s:`language`,k:`Parts of Speech`,r:208,q:`What is the predicate of this sentence? The children played in the park.`,ch:[`The children`,`played in the park`,`in the park`,`children`],a:1,exp:`The predicate tells what the subject did: played in the park.`},
{id:`l25`,s:`language`,k:`Parts of Speech`,r:214,q:`Which word is an abstract noun?`,ch:[`desk`,`apple`,`freedom`,`teacher`],a:2,exp:`Freedom is an idea or feeling you cannot touch, so it is an abstract noun.`},

{id:`l26`,s:`language`,k:`Grammar & Usage`,r:195,q:`Choose the correct verb. The dogs ___ barking loudly.`,ch:[`is`,`are`,`was`,`am`],a:1,exp:`Dogs is plural, so use are: The dogs are barking.`},
{id:`l27`,s:`language`,k:`Grammar & Usage`,r:205,q:`Choose the correct word. ___ going to the park after lunch.`,ch:[`There`,`Their`,`They're`,`Theyre`],a:2,exp:`They're is short for "they are," which fits the sentence.`},
{id:`l28`,s:`language`,k:`Grammar & Usage`,r:206,q:`Which group of words is a sentence fragment?`,ch:[`She walked home.`,`Ran to the store.`,`The dog barked.`,`We ate lunch.`],a:1,exp:`"Ran to the store" has no subject, so it is a fragment.`},
{id:`l29`,s:`language`,k:`Grammar & Usage`,r:209,q:`Which is the best way to fix this run-on sentence? I was tired I went to bed.`,ch:[`I was tired, so I went to bed.`,`I was tired, I went to bed.`,`I was tired and I went to bed and.`,`I was tired went to bed.`],a:0,exp:`Add a comma and a conjunction to join the two complete ideas correctly.`},
{id:`l30`,s:`language`,k:`Grammar & Usage`,r:215,q:`Choose the correct pronoun. Each student must bring ___ book to class.`,ch:[`their`,`his or her`,`they`,`them`],a:1,exp:`Each is singular, so use the singular "his or her."`},
{id:`l31`,s:`language`,k:`Grammar & Usage`,r:198,q:`Choose the correct past-tense verb. Yesterday, she ___ to school.`,ch:[`walk`,`walks`,`walked`,`walking`],a:2,exp:`Yesterday signals past tense, so use walked.`},
{id:`l32`,s:`language`,k:`Grammar & Usage`,r:199,q:`What is the correct comparative form of careful?`,ch:[`carefuler`,`more careful`,`most careful`,`carefully`],a:1,exp:`For longer adjectives, use more: more careful.`},
{id:`l33`,s:`language`,k:`Grammar & Usage`,r:207,q:`Which sentence does NOT use a double negative?`,ch:[`I don't have no money.`,`I didn't see nobody.`,`I don't have any money.`,`She never said nothing.`],a:2,exp:`"Any money" avoids the double negative. The other sentences use two negative words.`},
{id:`l34`,s:`language`,k:`Grammar & Usage`,r:210,q:`Which is the best way to combine these sentences? The boy was tall. He played basketball.`,ch:[`The tall boy played basketball.`,`The boy was tall he played basketball.`,`The boy played tall basketball.`,`The tall played boy basketball.`],a:0,exp:`Turning "tall" into an adjective creates one clear sentence.`},
{id:`l35`,s:`language`,k:`Grammar & Usage`,r:214,q:`Which sentence is a compound sentence?`,ch:[`I like tea, and she likes coffee.`,`I like tea with honey.`,`She likes coffee in the morning.`,`Because I like tea, we stopped.`],a:0,exp:`A compound sentence joins two complete ideas with a comma and a conjunction.`},

{id:`l36`,s:`language`,k:`Writing Process`,r:207,q:`Which of these is required in research writing?`,ch:[`a sense of humor`,`a list of references`,`personal experiences`,`an imaginary story`],a:1,exp:`Research writing uses sources, so a list of references is required to show where facts came from.`},
{id:`l37`,s:`language`,k:`Writing Process`,r:197,q:`What is the job of a topic sentence?`,ch:[`to tell the main idea of the paragraph`,`to end the paragraph`,`to list every detail`,`to ask a question`],a:0,exp:`A topic sentence states the main idea that the rest of the paragraph supports.`},
{id:`l38`,s:`language`,k:`Writing Process`,r:206,q:`Which transition word best shows a contrast?`,ch:[`However`,`Also`,`First`,`Because`],a:0,exp:`However signals that the next idea is different from the last one.`},
{id:`l39`,s:`language`,k:`Writing Process`,r:210,q:`Which sentence does NOT belong in a paragraph about how butterflies grow?`,ch:[`A butterfly begins as an egg.`,`The caterpillar eats leaves.`,`My uncle drives a blue truck.`,`It later forms a chrysalis.`],a:2,exp:`A blue truck is unrelated to the life cycle of a butterfly.`},
{id:`l40`,s:`language`,k:`Writing Process`,r:196,q:`What is the purpose of a concluding sentence?`,ch:[`to wrap up the paragraph's main idea`,`to introduce a new topic`,`to give the first detail`,`to list references`],a:0,exp:`A concluding sentence brings the paragraph to a close and restates the main idea.`},
{id:`l41`,s:`language`,k:`Writing Process`,r:188,q:`Which is the best title for a passage about how volcanoes erupt?`,ch:[`How Volcanoes Erupt`,`My Summer Vacation`,`A Recipe for Soup`,`The Life of a Butterfly`],a:0,exp:`A title should tell the reader what the passage is about.`},
{id:`l42`,s:`language`,k:`Writing Process`,r:209,q:`Which sentence states an opinion?`,ch:[`School should start later in the morning.`,`School starts at 8 a.m.`,`The school has 20 classrooms.`,`Students eat lunch at noon.`],a:0,exp:`"Should" expresses a belief, so it is an opinion.`},
{id:`l43`,s:`language`,k:`Writing Process`,r:217,q:`Which revision is clearest? The dog that was brown and small ran.`,ch:[`The small brown dog ran.`,`The dog ran that was brown and small.`,`The brown ran small dog.`,`The dog was brown and small ran.`],a:0,exp:`Putting the adjectives before the noun makes the sentence clear and smooth.`},

{id:`m1`,s:`math`,k:`Number Sense`,r:196,q:`What is the value of the digit 7 in 4,782?`,ch:[`7`,`70`,`700`,`7,000`],a:2,exp:`The 7 is in the hundreds place, so its value is 700.`},
{id:`m2`,s:`math`,k:`Number Sense`,r:195,q:`Round 3,568 to the nearest hundred.`,ch:[`3,500`,`3,600`,`3,570`,`4,000`],a:1,exp:`Look at the tens digit, 6. Since 6 is 5 or more, round up to 3,600.`},
{id:`m3`,s:`math`,k:`Number Sense`,r:204,q:`Which number is greater, 0.6 or 0.58?`,ch:[`0.6`,`0.58`,`They are equal`,`Cannot tell`],a:0,exp:`Write 0.6 as 0.60. 0.60 is greater than 0.58.`},
{id:`m4`,s:`math`,k:`Number Sense`,r:198,q:`Which list shows all the factors of 24?`,ch:[`1, 2, 3, 4, 6, 8, 12, 24`,`1, 2, 4, 6, 8, 24`,`2, 3, 4, 6, 8, 12`,`1, 2, 3, 5, 6, 8, 12, 24`],a:0,exp:`The factors of 24 are 1, 2, 3, 4, 6, 8, 12, and 24.`},
{id:`m5`,s:`math`,k:`Number Sense`,r:193,q:`Which list shows only multiples of 6?`,ch:[`6, 12, 18, 24`,`6, 9, 12, 15`,`4, 8, 12, 16`,`6, 12, 16, 20`],a:0,exp:`Multiples of 6 are 6, 12, 18, 24, and so on.`},
{id:`m6`,s:`math`,k:`Number Sense`,r:206,q:`Which of these numbers is prime?`,ch:[`4`,`7`,`9`,`12`],a:1,exp:`7 has only two factors, 1 and 7, so it is prime.`},
{id:`m7`,s:`math`,k:`Number Sense`,r:197,q:`Order these fractions from least to greatest: 1/2, 1/4, 3/4.`,ch:[`1/4, 1/2, 3/4`,`1/2, 1/4, 3/4`,`3/4, 1/2, 1/4`,`1/4, 3/4, 1/2`],a:0,exp:`One fourth is smallest, then one half, then three fourths.`},
{id:`m8`,s:`math`,k:`Number Sense`,r:194,q:`What is 5,321 in expanded form?`,ch:[`5,000 + 300 + 20 + 1`,`5,000 + 30 + 20 + 1`,`500 + 300 + 20 + 1`,`5,000 + 200 + 30 + 1`],a:0,exp:`5,321 = 5,000 + 300 + 20 + 1.`},
{id:`m9`,s:`math`,k:`Number Sense`,r:208,q:`Round 47.85 to the nearest tenth.`,ch:[`47.8`,`47.9`,`48.0`,`47.0`],a:1,exp:`The hundredths digit is 5, so round the tenths digit up: 47.9.`},
{id:`m10`,s:`math`,k:`Number Sense`,r:216,q:`Which fraction is greater, 3/5 or 5/8?`,ch:[`3/5`,`5/8`,`They are equal`,`Cannot tell`],a:1,exp:`3/5 = 0.60 and 5/8 = 0.625, so 5/8 is greater.`},
{id:`m11`,s:`math`,k:`Number Sense`,r:210,q:`Which number is divisible by 3?`,ch:[`124`,`125`,`123`,`128`],a:2,exp:`Add the digits of 123: 1 + 2 + 3 = 6, and 6 is divisible by 3.`},
{id:`m12`,s:`math`,k:`Number Sense`,r:214,q:`Which comparison is true?`,ch:[`-3 < -1`,`-3 > -1`,`-1 < -3`,`-3 = -1`],a:0,exp:`On a number line, -3 is to the left of -1, so -3 is less than -1.`},

{id:`m13`,s:`math`,k:`Operations & Fractions`,r:198,q:`A supermarket packed 60 eggs equally into 4 boxes. How many eggs were in 3 boxes?`,ch:[`15`,`20`,`36`,`45`],a:3,exp:`Each box has 60 divided by 4 = 15 eggs. Three boxes have 15 times 3 = 45 eggs.`},
{id:`m14`,s:`math`,k:`Operations & Fractions`,r:188,q:`347 + 286 = ?`,ch:[`523`,`633`,`623`,`643`],a:1,exp:`347 + 286 = 633.`},
{id:`m15`,s:`math`,k:`Operations & Fractions`,r:196,q:`5,000 - 2,368 = ?`,ch:[`2,732`,`2,632`,`2,532`,`3,632`],a:1,exp:`5,000 - 2,368 = 2,632.`},
{id:`m16`,s:`math`,k:`Operations & Fractions`,r:190,q:`24 × 6 = ?`,ch:[`124`,`134`,`144`,`154`],a:2,exp:`24 × 6 = 144.`},
{id:`m17`,s:`math`,k:`Operations & Fractions`,r:199,q:`156 ÷ 4 = ?`,ch:[`29`,`36`,`39`,`49`],a:2,exp:`156 ÷ 4 = 39 because 39 × 4 = 156.`},
{id:`m18`,s:`math`,k:`Operations & Fractions`,r:197,q:`3/8 + 2/8 = ?`,ch:[`5/8`,`5/16`,`1/8`,`6/8`],a:0,exp:`The denominators are the same, so add the numerators: 3 + 2 = 5, giving 5/8.`},
{id:`m19`,s:`math`,k:`Operations & Fractions`,r:205,q:`1/2 + 1/4 = ?`,ch:[`2/6`,`3/4`,`2/4`,`1/6`],a:1,exp:`1/2 = 2/4, so 2/4 + 1/4 = 3/4.`},
{id:`m20`,s:`math`,k:`Operations & Fractions`,r:208,q:`0.75 + 0.4 = ?`,ch:[`1.15`,`0.79`,`1.05`,`1.19`],a:0,exp:`Line up the decimal points: 0.75 + 0.40 = 1.15.`},
{id:`m21`,s:`math`,k:`Operations & Fractions`,r:196,q:`Mia bought 3 packs of pencils with 8 pencils in each pack. She also had 5 pencils at home. How many pencils does she have in all?`,ch:[`24`,`29`,`32`,`40`],a:1,exp:`3 × 8 = 24, then 24 + 5 = 29 pencils.`},
{id:`m22`,s:`math`,k:`Operations & Fractions`,r:207,q:`1 - 3/5 = ?`,ch:[`2/5`,`3/5`,`1/5`,`4/5`],a:0,exp:`Write 1 as 5/5. Then 5/5 - 3/5 = 2/5.`},
{id:`m23`,s:`math`,k:`Operations & Fractions`,r:203,q:`12 × 34 = ?`,ch:[`308`,`408`,`418`,`510`],a:1,exp:`12 × 34 = 408.`},
{id:`m24`,s:`math`,k:`Operations & Fractions`,r:213,q:`2.5 - 0.75 = ?`,ch:[`1.75`,`1.25`,`1.85`,`2.25`],a:0,exp:`2.50 - 0.75 = 1.75.`},
{id:`m25`,s:`math`,k:`Operations & Fractions`,r:206,q:`What is 1/4 of 8?`,ch:[`1`,`2`,`4`,`6`],a:1,exp:`1/4 of 8 means 8 ÷ 4 = 2.`},

{id:`m30`,s:`math`,k:`Algebra & Patterns`,r:189,q:`5 × ? = 35. What is the missing number?`,ch:[`5`,`6`,`7`,`8`],a:2,exp:`35 ÷ 5 = 7.`},

{id:`m53`,s:`math`,k:`Measurement`,r:210,q:`A class starts at 9:45 a.m. and ends at 11:20 a.m. How long is the class?`,ch:[`1 hour 25 minutes`,`1 hour 35 minutes`,`1 hour 45 minutes`,`2 hours 35 minutes`],a:1,exp:`From 9:45 to 10:45 is 1 hour, then 10:45 to 11:20 is 35 minutes. Total: 1 hour 35 minutes.`},
{id:`m54`,s:`math`,k:`Measurement`,r:196,q:`3 feet = ? yard(s)`,ch:[`1`,`2`,`3`,`6`],a:0,exp:`1 yard equals 3 feet.`},
{id:`m55`,s:`math`,k:`Measurement`,r:185,q:`1 hour = ? minutes`,ch:[`30`,`45`,`60`,`100`],a:2,exp:`1 hour equals 60 minutes.`},

{id:`m58`,s:`math`,k:`Measurement`,r:197,q:`You pay for a toy that costs 3 dollars 75 cents with a 5 dollar bill. How much change do you get?`,ch:[`1 dollar 25 cents`,`1 dollar 75 cents`,`2 dollars 25 cents`,`2 dollars 75 cents`],a:0,exp:`5.00 - 3.75 = 1.25, so you get 1 dollar 25 cents.`},

const WRITING_PROMPTS = [
  {id:`w1`, type:`Narrative`, title:`A Time You Tried Something New`, prompt:`Write a story about a time you tried something new for the first time. Explain what happened and how you felt before, during, and after.`, tips:[`Start with a hook that sets the scene.`,`Use time-order words: first, then, next, finally.`,`Include how you felt, not just what you did.`,`End with what you learned or how you changed.`], model:`The first time I climbed the climbing wall, my hands would not stop shaking. The wall looked as tall as a building. I watched other children reach the top, and I almost turned around.\n\nThen my coach said, "One hold at a time." I grabbed the lowest hold and pulled myself up. My heart was pounding, but I kept going. When I finally touched the top, the whole class cheered.\n\nThat day I learned that being brave does not mean you are not scared. It means you keep going even when you are.`},
  {id:`w2`, type:`Opinion`, title:`More Recess Time`, prompt:`Should students have more recess time at school? State your opinion and give at least two reasons with examples.`, tips:[`State your opinion clearly in the first paragraph.`,`Give two or three strong reasons.`,`Support each reason with an example from school life.`,`Answer the other side, then end with a strong call to action.`], model:`I believe students should have more recess time each day. Recess is not just free time; it helps us learn better.\n\nFirst, moving outside helps students focus in class. After running and playing, I can concentrate on math much more easily. Second, recess teaches us how to solve problems with friends. We learn to share, take turns, and include others.\n\nSome people say class time is too important to lose. However, healthy, happy students learn more in the time they have. More recess would make our school day better for everyone.`},
  {id:`w3`, type:`Informational`, title:`How the Water Cycle Works`, prompt:`Explain the water cycle to a younger student. Use at least three stages and clear details.`, tips:[`Begin with a big idea sentence.`,`Explain each stage in order: evaporation, condensation, precipitation.`,`Use a comparison to make it easy to understand.`,`End by explaining why the water cycle matters.`], model:`The water cycle is the journey water takes again and again. It has three main stages.\n\nFirst, the sun heats water in oceans and lakes. The water turns into vapor and rises. This is evaporation. Next, high in the sky, the vapor cools and forms tiny drops that make clouds. This is condensation. Finally, the drops join together and fall as rain or snow. This is precipitation.\n\nThe water cycle is important because it gives plants, animals, and people fresh water. Without it, our world would be dry and empty.`},
  {id:`w4`, type:`Narrative`, title:`The Mysterious Key`, prompt:`Imagine you found a mysterious key on the playground. Write a story about what happens next.`, tips:[`Describe the key with details.`,`Create a problem or surprise.`,`Use dialogue to bring characters to life.`,`Show the ending clearly, even if it is a twist.`], model:`The key was small and gold, with a tiny dragon carved on one side. It was lying under the slide, shining in the sun. I picked it up and looked around. No one was watching.\n\nOn the way home, I noticed a small locked box outside the library. It had a dragon on the lid. My heart jumped. I slid the key into the lock, and it fit perfectly. The box clicked open. Inside was a note: "Please return this book to shelf twelve." I laughed. It was a library mystery after all.\n\nI returned the book and kept the key. Now I always look under the slide.`},
  {id:`w5`, type:`Opinion`, title:`Book or Movie?`, prompt:`Is it better to read a book or watch a movie? Support your opinion with reasons and examples.`, tips:[`Choose one side and stay with it.`,`Compare both choices to show why yours is better.`,`Use a personal example.`,`End with a memorable closing sentence.`], model:`In my opinion, reading a book is better than watching a movie. A book lets you build the world in your own imagination.\n\nWhen I read a fantasy book, I decide what the castle looks like and how the characters sound. A movie shows one version, but a book can belong to every reader. Books also give more details about why characters make choices. For example, the movie version of my favorite story skipped a whole chapter about the hero's family.\n\nMovies are fun, but a good book stays with you longer. That is why I will always choose the book first.`},
  {id:`w6`, type:`Informational`, title:`A Place That Matters to You`, prompt:`Describe a place that is special to you and explain why it matters. Include sensory details and at least two reasons.`, tips:[`Open with the place and one strong image.`,`Describe what you see, hear, and smell.`,`Explain two reasons it matters.`,`Close by showing how you feel when you are there.`], model:`The beach near my grandparents' home is my favorite place in the world. I know it by sound before I even see it.\n\nWhen I step onto the sand, I hear gulls calling and waves rolling. The air smells salty, and the sand feels warm and soft under my feet. At low tide, tiny crabs scoot across the rocks.\n\nThis place matters to me for two reasons. First, my grandfather taught me to skip stones there. Second, it is where our whole family gathers every summer, laughing and eating ice cream as the sun goes down. When I am there, I feel calm and at home.`}
];

const SKILL_SECTION = {};
DB.forEach(q => { SKILL_SECTION[q.k] = q.s; });
const ALL_SKILLS = [...new Set(DB.map(q => q.k))];

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function todayKey(d){
  const x = d || new Date();
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,"0");
  const day = String(x.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + day;
}
function daysUntil(dateStr){
  const t = new Date(dateStr + "T00:00:00");
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.ceil((t - n) / 86400000);
}
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatTestDate(){
  const d = new Date(state.testDate + "T00:00:00");
  if(isNaN(d.getTime())) return state.testDate;
  return d.getDate() + " " + MONTHS_SHORT[d.getMonth()] + " " + d.getFullYear();
}
function fmtClock(ms){
  if(ms < 0) ms = 0;
  const total = Math.floor(ms/1000);
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  if(h > 0) return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function mastery(k){
  const s = state.skills[k];
  if(!s || !s.attempts) return null;
  return Math.round(s.ewma * 100);
}
function recordSkill(k, correct){
  const s = state.skills[k] || {attempts:0, correct:0, ewma:0.5};
  s.attempts++;
  if(correct) s.correct++;
  s.ewma = s.ewma * 0.68 + (correct ? 1 : 0) * 0.32;
  state.skills[k] = s;
}
function eloUpdate(section, q, correct, scale){
  scale = scale == null ? 1 : scale;
  const ab = state.ability[section];
  const p = 1 / (1 + Math.exp((q.r - ab) / 14));
  const delta = (correct ? (1 - p) : -p) * 12 * scale;
  state.ability[section] = Math.max(160, Math.min(250, ab + delta));
}
function abilityOf(section){ return Math.round(state.ability[section]); }
function skillRows(){
  return ALL_SKILLS.map(k => {
    const m = mastery(k);
    const s = state.skills[k];
    return {k, m, attempts: s ? s.attempts : 0, section: SKILL_SECTION[k]};
  });
}
function weakest(n){
  const rows = skillRows().filter(r => r.m !== null).sort((a,b) => a.m - b.m);
  if(rows.length >= n) return rows.slice(0,n);
  const fallback = ["Informational Text","Operations & Fractions","Grammar & Usage"].map(k => ({k, m:null, attempts:0, section:SKILL_SECTION[k]}));
  return rows.concat(fallback).slice(0,n);
}
function pickQuestion(section, ability, used){
  let pool = DB.filter(q => q.s === section && !used.has(q.id));
  if(!pool.length){
    used.clear();
    pool = DB.filter(q => q.s === section);
  }
  let best = null, bestScore = -1e9;
  for(const q of pool){
    const diff = Math.abs(q.r - ability);
    const m = mastery(q.k);
    const mast = m === null ? 0.5 : m / 100;
    const explore = (state.skills[q.k] && state.skills[q.k].attempts >= 2) ? 0 : 6;
    const score = -diff * 1.55 + (1 - mast) * 42 + explore + Math.random() * 16;
    if(score > bestScore){ bestScore = score; best = q; }
  }
  return best;
}
function pickSkillQuestion(skill, used){
  let pool = DB.filter(q => q.k === skill && !used.has(q.id));
  if(!pool.length){ used.clear(); pool = DB.filter(q => q.k === skill); }
  return pool[Math.floor(Math.random() * pool.length)];
}
function touchStreak(){
  const t = todayKey();
  if(state.streak.last === t) return;
  const y = todayKey(new Date(Date.now() - 86400000));
  state.streak.count = state.streak.last === y ? state.streak.count + 1 : 1;
  state.streak.last = t;
}
function markPlan(id){
  const p = getPlan();
  p.done[id] = true;
  save();
}

function countdownRows(){
  const end = new Date(state.testDate + "T00:00:00");
  const start = new Date(); start.setHours(0,0,0,0);
  const rows = [];
  let i = 0;
  for(let t = new Date(start); t <= end && i < 21; t.setDate(t.getDate() + 1)){
    rows.push({date: todayKey(t), focus: COUNTDOWN_FOCUS[i % COUNTDOWN_FOCUS.length], today: todayKey(t) === todayKey()});
    i++;
  }
  return rows;
}
function getPlan(){  const t = todayKey();
  if(!state.plan || state.plan.date !== t){
    const w = weakest(2);
    state.plan = {
      date: t,
      items: [
        {id:"warm", label:"Warm-up: 24 adaptive questions across all subjects", action:"daily"},
        {id:"focus", label:"Focus drill: " + (w[0] ? w[0].k : "Vocabulary"), action:"drill", skill: w[0] ? w[0].k : "Vocabulary"},
        {id:"read", label:"Read for 20 minutes, then retell the main idea aloud", action:"none"},
        {id:"write", label:"Writing Studio: plan and write one timed response", action:"writing"}
      ],
      done: {}
    };

  }
  return state.plan;
}

function erfc(x){
  const z = Math.abs(x);
  const t = 1 / (1 + 0.5 * z);
  const r = t * Math.exp(-z*z - 1.26551223 + t*(1.00002368 + t*(0.37409196 + t*(0.09678418 + t*(-0.18628806 + t*(0.27886807 + t*(-1.13520398 + t*(1.48851587 + t*(-0.82215223 + t*0.17087277)))))))));
  return x >= 0 ? r : 2 - r;
}
function percentile(rit){
  const z = (rit - 200) / 15;
  const p = 0.5 * erfc(-z / Math.SQRT2);
  return Math.max(1, Math.min(99, Math.round(p * 100)));
}
function ritLabel(rit){
  if(rit < 190) return "Building foundations";
  if(rit < 200) return "Approaching grade level";
  if(rit < 210) return "At grade level";
  if(rit < 220) return "Above grade level";
  return "Advanced";
}

function startPractice(kind, skill){
  const used = new Set();
  let plan = [];
  if(kind === "drill" && skill){
    const skillCount = DB.filter(q => q.k === skill).length;
    plan = Array(Math.min(12, skillCount)).fill(skill);
  }else{
    plan = [];
    const counts = {reading:10, language:7, math:7};
    for(const sec of ["reading","language","math"]){
      for(let i=0;i<counts[sec];i++) plan.push(sec);
    }
    for(let i=plan.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1));[plan[i],plan[j]]=[plan[j],plan[i]]; }
  }
  practice = {
    mode: kind, skill: skill || null, plan, idx:0, count: plan.length,
    answers:[], used, current:null, selected:null, checked:false,
    start: Date.now(), done:false, reviewSkill:null
  };

  route = "practice";
  render();

function loadPracticeQuestion(){
  if(practice.idx >= practice.count){ finishPractice(); return; }

    q = pickSkillQuestion(practice.skill, practice.used);
  } else if(practice.reviewSkill && Math.random() < 0.7){
    q = pickSkillQuestion(practice.reviewSkill, practice.used);
    practice.reviewSkill = null;
  } else {

    q = pickQuestion(target, state.ability[target], practice.used);

  practice.selected = null;
  practice.checked = false;
  practice.used.add(q.id);
  focusQid = q.id;

function buildResult(type, answers, title, examInfo){
  const total = answers.length;
  const totalCorrect = answers.filter(a => a.correct).length;
  const bySection = {};
  const bySkill = {};
  answers.forEach(a => {
    if(!bySection[a.s]) bySection[a.s] = {correct:0, total:0};
    bySection[a.s].total++;
    if(a.correct) bySection[a.s].correct++;
    if(!bySkill[a.k]) bySkill[a.k] = {correct:0, total:0};
    bySkill[a.k].total++;
    if(a.correct) bySkill[a.k].correct++;
  });
  const sections = Object.keys(bySection).map(sec => ({
    key: sec, name: SECTIONS[sec].name, correct: bySection[sec].correct, total: bySection[sec].total,
    rit: abilityOf(sec), pct: Math.round(bySection[sec].correct / bySection[sec].total * 100)
  }));
  const skills = Object.keys(bySkill).map(k => ({
    k, correct: bySkill[k].correct, total: bySkill[k].total,
    pct: Math.round(bySkill[k].correct / bySkill[k].total * 100)
  })).sort((a,b) => a.pct - b.pct);
  const overallRit = sections.length ? Math.round(sections.reduce((a,s) => a + s.rit, 0) / sections.length) : 200;
  return {
    type, title, date: todayKey(), total, totalCorrect,
    accuracy: total ? Math.round(totalCorrect/total*100) : 0,
    sections, skills, answers, overallRit, examInfo: examInfo || null
  };
}

function examChoose(i){ const part = currentPart(); part.pending = i; render(); }
function examNext(){
  const part = currentPart();
  if(part.pending === null) return;
  const q = part.current;
  const correct = part.pending === q.a;
  recordSkill(q.k, correct);
  eloUpdate(part.section, q, correct, 1);
  const answerObj = {id:q.id, s:q.s, k:q.k, q:q.q, ch:q.ch.slice(), sel:part.pending, ans:q.a, correct, exp:q.exp};
  part.answers.push(answerObj);
  part.idx++;
  part.pending = null;
  if(part.idx >= part.count){ part.done = true; part.current = null; }
  else { loadExamQuestion(part); }
  save();
  render();
}
function continuePart(){
  if(exam.part + 1 >= exam.parts.length){ finishExam(false); return; }
  exam.part++;
  const part = currentPart();
  if(part.type === "mc" && !part.current){ loadExamQuestion(part); }
  render();
  window.scrollTo(0,0);
}
function finishExamPart(){
  const part = currentPart();
  if(part.type === "writing"){
    const ta = document.getElementById("examWriting");
    if(ta) part.text = ta.value;
  }
  part.done = true;
  continuePart();
}
function finishExam(timeUp){
  if(!exam || exam.finished) return;
  clearInterval(exam.timer);
  const all = [];
  exam.parts.forEach(p => { if(p.type === "mc") all.push(...p.answers); });
  const writingPart = exam.parts.find(p => p.type === "writing");
  const oralPart = exam.parts.find(p => p.type === "oral");
  const info = {
    timeUp: !!timeUp,
    usedMin: Math.round((Date.now() - exam.started)/60000),
    writing: writingPart ? { text: writingPart.text || "", words: (writingPart.text||"").trim() ? (writingPart.text.trim().split(/\s+/).length) : 0, prompt: writingPart.prompt || null } : null,
    oral: oralPart ? oralPart.ratings.slice() : []
  };
  const res = buildResult("exam", all, timeUp ? "Mock exam (time ended)" : "Full mock exam", info);
  lastResult = res;
  exam.finished = true;
  state.history.push({date:todayKey(), type:"exam", rit:res.overallRit, correct:res.totalCorrect, total:res.total, label:"Mock exam"});
  if(info.writing && info.writing.words) state.writingDone++;
  touchStreak();
  save();
  route = "result";
  render();
  window.scrollTo(0,0);
}

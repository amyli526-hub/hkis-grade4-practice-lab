}
function stopOral(){
  if(oralState.interval){ clearInterval(oralState.interval); oralState.interval = null; }
  if(oralState.recorder && oralState.recorder.state === "recording"){ try{ oralState.recorder.stop(); }catch(e){} }
  if(oralState.stream){ try{ oralState.stream.getTracks().forEach(t => t.stop()); }catch(e){} oralState.stream = null; }
  oralState.recorder = null;
  oralState.chunks = [];
}
async function toggleRecord(){
  const status = document.getElementById("recStatus");
  const btn = document.getElementById("recBtn");
  if(oralState.recorder && oralState.recorder.state === "recording"){
    oralState.recorder.stop();
    if(btn) btn.textContent = "Record";
    if(status) status.textContent = "Recording stopped. Listen back below.";
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    oralState.stream = stream;
    oralState.chunks = [];
    const rec = new MediaRecorder(stream);
    oralState.recorder = rec;
    rec.ondataavailable = e => { if(e.data.size) oralState.chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(oralState.chunks, {type:"audio/webm"});
      if(oralState.url) URL.revokeObjectURL(oralState.url);
      oralState.url = URL.createObjectURL(blob);
      const audio = document.getElementById("oralAudio");
      if(audio){ audio.src = oralState.url; audio.style.display = "block"; }
      if(oralState.stream){ oralState.stream.getTracks().forEach(t => t.stop()); oralState.stream = null; }
    };
    rec.start();
    if(btn) btn.textContent = "Stop";
    if(status) status.textContent = "Recording...";
    startOralTimer();
  }catch(e){
    if(status) status.textContent = "Microphone not available. Speak aloud instead.";
  }
}
function oralRate(i, v){
  if(!exam) return;
  const part = exam.parts.find(p => p.type === "oral");
  if(!part) return;
  part.ratings[i] = v;
  const el = document.getElementById("oralRate" + i);
  if(el) el.textContent = "saved";
}
function findOralEntry(idx){
  const prompt = ORAL_PROMPTS[idx].q;
  const date = todayKey();
  return (state.oralNotes || []).find(e => e && e.date === date && e.prompt === prompt);
}
function ensureOralEntry(idx){
  state.oralNotes = state.oralNotes || [];
  let entry = findOralEntry(idx);
  if(!entry){
    entry = {date:todayKey(), prompt:ORAL_PROMPTS[idx].q, ratings:[0,0,0,0,0]};
    state.oralNotes.push(entry);
  }
  if(!Array.isArray(entry.ratings)) entry.ratings = [0,0,0,0,0];
  return entry;
}
function saveOral(){
  touchStreak();
  ensureOralEntry(oralState.index);
  save();
  alert("Saved. Next time, try to add one more detail and a stronger closing sentence.");
}

function viewReport(){
  const rows = skillRows().filter(r => r.attempts > 0).sort((a,b) => a.m - b.m);
  const hist = state.history.slice().reverse().slice(0,12);
  const exams = state.history.filter(h => h.type === "exam");
  const lastExam = exams.length ? exams[exams.length-1] : null;
  const avgRit = state.history.length ? Math.round(state.history.reduce((a,h) => a + h.rit, 0) / state.history.length) : null;
  const drafts = WRITING_PROMPTS.map(p => ({p, text: state.drafts[p.id] || ""})).filter(d => d.text.trim());
  const trend = state.history.slice(-10).map(h => h.rit);
  let spark = "";
  if(trend.length > 1){
    const min = Math.min(...trend) - 5, max = Math.max(...trend) + 5;
    const pts = trend.map((v,i) => {
      const x = (i / (trend.length-1)) * 300 + 10;
      const y = 90 - ((v - min) / Math.max(1, max - min)) * 70;
      return x + "," + y;
    }).join(" ");
    spark = `<svg viewBox="0 0 320 100" style="width:100%;height:100px"><polyline fill="none" stroke="#2563eb" stroke-width="3" points="${pts}"/></svg>`;
  }
  return `
  <div class="card">
    <div class="kicker">Progress report</div>
    <h2 style="font-size:22px">${state.name ? esc(state.name) + "'s" : "Your"} preparation snapshot</h2>
    <div class="grid g4" style="margin-top:14px">
      <div class="stat"><div class="n">${state.history.length}</div><div class="l">Sessions logged</div></div>
      <div class="stat"><div class="n">${avgRit || "--"}</div><div class="l">Average RIT</div></div>
      <div class="stat"><div class="n">${state.streak.count}</div><div class="l">Day streak</div></div>
      <div class="stat"><div class="n">${drafts.length}</div><div class="l">Writing samples</div></div>
    </div>
  </div>

  <div class="split" style="margin-top:16px">
    <div class="card">
      <h2>Skill mastery</h2>
      ${rows.length ? rows.map(r => `
        <div class="skillrow" style="grid-template-columns:1fr 1fr 44px;gap:10px">
          <div class="name" style="white-space:normal">${esc(r.k)}</div>
          <div class="bar"><i style="width:${r.m}%;background:${r.m>=80?'#137a4b':r.m>=60?'#a86400':'#c8102e'}"></i></div>
          <div class="pct">${r.m}%</div>
        </div>`).join("") : `<p class="empty">No skill data yet. Complete one practice set and this fills in automatically.</p>`}
      <div class="actions" style="justify-content:flex-start;margin-top:12px">
        <button class="btn red small" data-action="startDaily">Practice weakest skills</button>
      </div>
    </div>
    <div class="card">
      <h2>RIT trend</h2>
      ${spark || `<p class="empty">Your trend line appears after two sessions.</p>`}
      <h3 style="margin-top:14px">Latest mock exam</h3>
      ${lastExam ? `<p><b>${lastExam.rit}</b> estimated RIT &middot; ${lastExam.correct}/${lastExam.total} correct &middot; ${esc(lastExam.date)}</p>` : `<p class="empty">No mock exam yet. Try one this week to build stamina.</p>`}
      <div class="actions" style="justify-content:flex-start">
        <button class="btn ghost small" data-action="startExam">Take a mock exam</button>
      </div>
      <div class="note" style="margin-top:12px">Target range for a confident Grade 4 entry profile: roughly 200-215 RIT in reading and language, 205-220 in math. Use this as a practice guide only.</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Recent sessions</h2>
    ${hist.length ? `<table>
      <thead><tr><th>Date</th><th>Type</th><th>RIT</th><th>Score</th></tr></thead>
      <tbody>${hist.map(h => `<tr><td>${esc(h.date)}</td><td>${esc(h.label || h.type)}</td><td><span class="ritbadge">${h.rit}</span></td><td>${h.correct}/${h.total}</td></tr>`).join("")}</tbody>
    </table>` : `<p class="empty">No sessions yet.</p>`}
  </div>

  ${drafts.length ? `<div class="card" style="margin-top:16px">
    <h2>Writing samples</h2>
    ${drafts.map(({p,text}) => {
      const words = text.trim().split(/\s+/).length;
      return `<div class="review">
        <div class="rq">${esc(p.type)}: ${esc(p.title)}</div>
        <div style="color:#647083;margin-top:4px">${words} words</div>
        <div style="white-space:pre-line;margin-top:6px;color:#33445c">${esc(text.slice(0,420))}${text.length>420?"...":""}</div>
      </div>`;
    }).join("")}
  </div>` : ""}

  <div class="card" style="margin-top:16px">
    <h2>Daily schedule until ${esc(formatTestDate())}</h2>
    <p style="margin-bottom:10px">A predictable 30-minute routine beats one long cram session. Adjust to your child's energy.</p>
    <table>
      <thead><tr><th>Day</th><th>Focus</th><th>Task</th></tr></thead>
      <tbody>
        <tr><td>Mon-Fri</td><td>Skills</td><td>1 adaptive set plus 1 weak-skill drill</td></tr>
        <tr><td>Sat</td><td>Writing</td><td>1 full timed prompt, then checklist review</td></tr>
        <tr><td>Sun</td><td>Simulation</td><td>Full mock exam, then read every explanation</td></tr>
        <tr><td>Final 2 days</td><td>Confidence</td><td>Light reading, speaking practice, early sleep</td></tr>
      </tbody>
    </table>
    <div class="actions" style="justify-content:flex-start;margin-top:14px">
      <button class="btn ghost small" data-action="exportData">Export progress</button>
      <button class="btn ghost small" data-action="printReport">Print report</button>
      <button class="btn ghost small" data-action="resetData">Reset data</button>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Day-by-day countdown to test day</h2>
    <p style="margin-bottom:10px">A suggested focus for each day. Keep sessions to about 30 minutes and stop while your child still feels successful.</p>
    ${countdownRows().length ? `<table>
      <thead><tr><th>Date</th><th>Suggested focus</th></tr></thead>
      <tbody>${countdownRows().map(r => `<tr ${r.today?'style="background:#fff9e9"':''}><td>${esc(r.date)}${r.today?' <b>(today)</b>':''}</td><td>${esc(r.focus)}</td></tr>`).join("")}</tbody>
    </table>` : `<p class="empty">The test date has passed. Update the date on the dashboard to build a new plan.</p>`}
  </div>`;
}

function viewAbout(){
  return `
  <div class="card">
    <div class="kicker">What the sources say</div>
    <h2 style="font-size:22px">How this simulation was built</h2>
    <p>The design follows the public admissions information below. It is a practice tool, not an official sample paper.</p>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h2>HKIS pre-entry assessment</h2>
      <p><b>Who:</b> selected applicants from Grade 3 to Grade 12 are invited to a pre-entry assessment.</p>
      <p><b>What:</b> a standardized computerized adaptive assessment covering math, reading, writing, and oral language.</p>
      <p><b>When:</b> invitations are based on priority and space; families schedule through the admissions portal.</p>
      <p><b>Entry criteria:</b> English proficiency, demonstrated academic achievement, personal characteristics, fit with HKIS learning results, and proven success in a similar school environment.</p>
      <p style="font-size:12px;color:#8b8576">Source: hkis.edu.hk/admissions/how-to-apply and hkis.edu.hk/admissions/faq</p>
    </div>
    <div class="card">
      <h2>Grade 3-5 test format</h2>
      <p>The assessment is described as a standardized test such as MAP plus a writing prompt. HKIS reports that the session runs about 2.5 hours.</p>
      <p><b>MAP sections:</b> Reading, Language Usage, and Mathematics (Science is optional at some schools).</p>
      <p><b>Question types:</b> mostly multiple choice, with drag-and-drop, fill-in, and other interactive items.</p>
      <p><b>Adaptive:</b> a correct answer raises the difficulty; a wrong answer lowers it. The goal is to find the level the child can answer about half the time.</p>
      <p><b>Scoring:</b> RIT, an equal-interval scale that tracks growth across grades.</p>
      <p style="font-size:12px;color:#8b8576">Sources: topschoolsadmissions.com/blog/3, ampla-edu.com MAP page, testprep-online.com MAP 4th grade, warmup.nwea.org</p>
    </div>
    <div class="card">
      <h2>Grade 4 skill expectations</h2>
      <p><b>Reading:</b> vocabulary in context, literary and informational texts, main idea, inference, author's purpose, summarising, and comparing texts.</p>
      <p><b>Language:</b> mechanics (capitals, punctuation, spelling), parts of speech, grammar and usage, sentence structure, and the writing process.</p>
      <p><b>Math:</b> number sense, multi-step operations, fractions and decimals, patterns and algebra, geometry, measurement, and data.</p>
      <p><b>Writing:</b> narrative, opinion, and informational responses with organization, detail, transitions, and a clear ending.</p>
    </div>
    <div class="card">
      <h2>How the adaptive engine works here</h2>
      <p>Each question carries a difficulty level on the RIT scale. The engine starts at the stored ability estimate for the subject, picks the closest useful question, and updates the estimate after each answer.</p>
      <p>A weakness score is calculated for every skill. Questions from weaker skills are weighted more heavily, so practice time goes where it is needed most.</p>
      <p>Reports show an estimated RIT, an approximate percentile for a typical Grade 4 cohort, and a ranked list of skills to review.</p>
      <div class="note" style="margin-top:10px">RIT estimates in this app are approximations for practice only. They are not official NWEA scores and do not predict an HKIS admissions decision.</div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2>Using the lab in the final two weeks</h2>
    <div class="grid g3" style="margin-top:8px">
      <div><h3>Week 1: diagnose</h3><p>Do 2-3 adaptive sets and one mock exam. Read every explanation together. Note the two weakest skills.</p></div>
      <div><h3>Week 2: target</h3><p>Alternate a weak-skill drill with a timed writing prompt. Keep reading aloud daily for fluency and oral language.</p></div>
      <div><h3>Last 2 days: rest</h3><p>One light practice set, one speaking practice, early bedtime. Confidence and sleep matter more than new content.</p></div>
    </div>
    <div class="disclaimer">Disclaimer: This is an independent practice tool. It is not produced, endorsed, or reviewed by Hong Kong International School, NWEA, or any admissions consultant. Question content is original and aligned to publicly described Grade 4 skills. External sources are linked for reference only.</div>
  </div>`;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  if(action === "nav"){ navigate(el.dataset.route); return; }
  if(action === "startDaily"){ startPractice("daily", null); return; }
  if(action === "startDrill"){ startPractice("drill", el.dataset.skill); return; }
  if(action === "startExam"){ navigate("mock"); return; }
  if(action === "startExamNow"){
    const ready = document.getElementById("readyBox");
    const quiet = document.getElementById("quietBox");
    if(ready && quiet && (!ready.checked || !quiet.checked)){
      alert("Please confirm both checkboxes before starting the mock exam."); return;
    }
    startExam(); return;
  }
  if(action === "togglePlan"){
    const p = getPlan();
    p.done[el.dataset.id] = !p.done[el.dataset.id];
    save(); render(); return;
  }
  if(action === "choose"){
    if(!practice || practice.checked) return;
    practice.selected = parseInt(el.dataset.i, 10); render(); return;
  }
  if(action === "checkAnswer"){ checkPractice(); return; }
  if(action === "nextPractice"){ nextPractice(); return; }
  if(action === "exitPractice"){
    if(confirm("End this practice set and see your report?")){
      if(practice && practice.answers.length) finishPractice();
      else { practice = null; route = "practice"; render(); }
    }
    return;
  }
  if(action === "examChoose"){ examChoose(parseInt(el.dataset.i,10)); return; }
  if(action === "examNext"){ examNext(); return; }
  if(action === "continuePart"){ continuePart(); return; }
  if(action === "finishExamPart"){ finishExamPart(); return; }
  if(action === "saveExamWriting"){
    const ta = document.getElementById("examWriting");
    if(ta){ currentPart().text = ta.value; alert("Draft saved."); }
    return;
  }
  if(action === "examWritingNext"){
    const ta = document.getElementById("examWriting");
    if(ta){ currentPart().text = ta.value; }
    finishExamPart(); return;
  }
  if(action === "exitExam"){ exitExam(); return; }
  if(action === "rateOral"){
    if(!exam) return;
    const part = exam.parts.find(p => p.type === "oral");
    if(!part) return;
    part.ratings[parseInt(el.dataset.i,10)] = parseInt(el.dataset.v,10);
    const nm = document.getElementById("oralRate" + el.dataset.i);
    if(nm) nm.textContent = "saved";
    return;
  }
  if(action === "changePrompt"){ return; }
  if(action === "startWritingTimer"){ startWritingTimer(); return; }
  if(action === "resetWritingTimer"){ resetWritingTimer(); return; }
  if(action === "saveDraft"){ saveDraft(); return; }
  if(action === "markWriting"){ markWriting(); return; }
  if(action === "showModel"){ showModel(); return; }
  if(action === "oralStart"){ startOralTimer(); return; }
  if(action === "oralStop"){ stopOral(); return; }
  if(action === "toggleRecord"){ toggleRecord(); return; }
  if(action === "changeOral"){ return; }
  if(action === "oralRate"){
    const item = parseInt(el.dataset.i, 10);
    const value = parseInt(el.dataset.v, 10);
    const entry = ensureOralEntry(oralState.index);
    entry.ratings[item] = value;
    save();
    const row = el.parentElement;
    if(row){
      Array.from(row.querySelectorAll('[data-action="oralRate"]')).forEach(b => {
        b.classList.toggle("rated", b === el);
      });
    }
    return;
  }
  if(action === "saveOral"){ saveOral(); return; }
  if(action === "setName"){
    const n = prompt("Student's first name:", state.name || "");
    if(n !== null){ state.name = n.trim().slice(0,30); save(); render(); }
    return;
  }
  if(action === "exportData"){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hkis-grade4-progress.json";
    a.click();
    return;
  }
  if(action === "printReport"){ window.print(); return; }
  if(action === "resetData"){
    if(confirm("Reset all progress? This cannot be undone.")){
      state = defaultState(); save(); practice = null; exam = null; lastResult = null; navigate("home");
    }
    return;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if(el.id === "promptSelect"){ changePrompt(el.value); return; }
  if(el.id === "oralSelect"){ changeOral(el.value); return; }
  if(el.id === "testDateInput"){
    if(el.value){ state.testDate = el.value; save(); render(); }
    return;
  }
});

document.addEventListener("input", (e) => {
  if(e.target.id === "examWriting"){
    const part = exam && currentPart();
    if(part) part.text = e.target.value;
    const wc = document.getElementById("examWordCount");
    if(wc){
      const t = e.target.value.trim();
      wc.textContent = (t ? t.split(/\s+/).length : 0) + " words";
    }
  }
});

window.addEventListener("beforeunload", (e) => {
  if(exam && !exam.finished){ e.preventDefault(); e.returnValue = ""; }
});

render();
</script>
